  --sadan:#B297E6;--sadan-tint:#2A2140;--pm:#C3D7FD;--pm-tint:#1A2233;--personal:#5CC9BB;--personal-tint:#11302C;--personal-ink:#062A26;--ent-ink:#121017;--warn:#E5B51C;--warn-tint:#33290B;
  --late:#F2827A;--late-tint:#3A1B1B;--ok:#68C793;--ok-tint:#16301F;
  --run-bg:#2A1B47;--run-fg:#F5F0FC;--run-muted:#BBAFD2;--run-line:#47366B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 72px;display:flex;flex-direction:column;gap:26px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}
.ic,.play,.send,.who{padding:0;flex:none;line-height:0}
.ic svg,.play svg,.send svg{flex:none;pointer-events:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,.f-head{font-family:var(--f-head);font-weight:700;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg{display:block}

/* header */
.hdr{display:flex;flex-direction:column;gap:10px}
.greet{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.greet h1{font-size:21px;line-height:1.3}
.greet p{margin:0;color:var(--muted);font-size:13px}
.work{display:flex;flex-direction:column;gap:6px}
body.notools .work,body.notools .play,body.notools .ic.star{display:none}body.notools .row:has(>.play){grid-template-columns:minmax(0,1fr) auto}
#entry::placeholder{color:var(--faint);opacity:1}
.work-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.work-top strong{margin-inline-start:4px;color:var(--fg)}
.work-top span{color:var(--muted);font-size:13px}
.work-top strong{font-family:var(--f-head);font-size:16px}
.bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin:0;padding:0;list-style:none;font-size:12px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.bg-sadan{background:var(--sadan)}.bg-pm{background:var(--pm)}.bg-personal{background:var(--personal)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:350px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:0;min-width:0}
.stat b{font-family:var(--f-head);font-size:18px;line-height:1.25}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.alert{background:var(--late-tint);border-color:transparent}
.stat.alert b,.stat.alert span{color:var(--late)}

/* entry */
.entry{display:flex;flex-direction:column;gap:12px}
.entry-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:border-color .2s}
.entry-box:focus-within{border-color:var(--brand)}
#entry{display:block;width:100%;min-height:96px;max-height:40vh;resize:none;border:0;background:transparent;padding:14px 16px 14px 64px;font-size:16px;line-height:1.7;outline:none;border-radius:18px}
.send{position:absolute;left:10px;bottom:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;transition:transform .15s,opacity .2s}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.45;cursor:default}
.thinking{display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.thinking-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.thinking-row span{color:var(--muted);font-size:14px}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.review{display:flex;flex-direction:column;gap:12px}
.review-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.review-head h2{font-size:17px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.rv-top{display:flex;gap:8px;align-items:flex-start}
.rv-top .ic{margin-top:2px}
.rv-note{margin:0;font-size:13px;color:var(--muted)}
.review-actions{display:flex;gap:8px}

/* controls */
.in{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;min-height:44px;margin:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 11px;font-size:16px;line-height:1.4;-webkit-appearance:none;appearance:none}
select.in{-webkit-appearance:menulist;appearance:auto}
input[type=date].in,input[type=time].in{text-align:right;overflow:hidden}
input[type=date].in::-webkit-date-and-time-value,input[type=time].in::-webkit-date-and-time-value{text-align:right;min-height:1.4em}
input[type=date].in::-webkit-calendar-picker-indicator,input[type=time].in::-webkit-calendar-picker-indicator{margin:0}
textarea.title-in{resize:none;overflow:hidden;font-weight:600}
.in:focus{outline:none;border-color:var(--brand)}
.in.missing{border-color:var(--warn);background:var(--warn-tint)}
.pick{position:relative}
.pick .ph{position:absolute;right:auto;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:15px}
.pick:not(.is-empty) .ph,.pick.is-empty:focus-within .ph{display:none}
.pick.is-empty input{color:transparent}
.pick.is-empty input::-webkit-datetime-edit{color:transparent}
.pick.is-empty input:focus,.pick.is-empty input:focus::-webkit-datetime-edit{color:var(--fg)}
.title-in{font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field.missing label{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 14px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg button.on.e-sadan{background:var(--sadan);border-color:var(--sadan);color:var(--ent-ink)}
.seg button.on.e-pm{background:var(--pm);border-color:var(--pm);color:var(--ent-ink)}
.seg button.on.e-personal{background:var(--personal);border-color:var(--personal);color:var(--personal-ink)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.day{flex:0 0 auto;width:52px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:5px 0;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.day span{font-size:12px;color:var(--muted)}
.day b{font-size:16px;font-variant-numeric:tabular-nums}
.day.wk{background:var(--sunk)}

.day.on span{color:var(--brand-ink);opacity:.85}
.btn{border:0;border-radius:99px;padding:9px 18px;font-weight:600;font-size:14.5px;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}

.btn.danger{background:var(--late);color:#fff}
.btn.small{padding:6px 13px;font-size:13px}
.btn:disabled{opacity:.5}
.ic{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--faint);flex:0 0 auto}
.ic:hover{background:var(--sunk);color:var(--fg)}
.links{display:flex;gap:18px;flex-wrap:wrap}
.link{all:unset;cursor:pointer;color:var(--brand);font-size:13.5px;font-weight:600}
:root[data-theme="dark"] .link{color:var(--sadan)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--sadan)}}
.who{align-self:start;width:38px;height:38px;border-radius:50%;background:var(--et);color:var(--ec);display:grid;place-items:center;font-weight:700;font-size:15px}
.ic.star.on{color:var(--gold)}
.cap{margin:0;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}

.rvw{display:flex;flex-direction:column;gap:12px}
.rvw-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted)}

.drow{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.drow .t{font-weight:600;overflow-wrap:anywhere}

.drow.pm-q .why{color:var(--muted)}
.adv{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:2px;padding:8px 10px;border-radius:12px;background:var(--brand-tint)}

.log{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sec-s{font:500 12.5px var(--f-body);color:var(--faint);margin-inline-start:6px}.lday.mon.open{padding-bottom:6px}.mday{padding:0 10px}.mdh{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 6px;font-size:13px;color:var(--muted)}.mdh b{font:700 14px var(--f-head);color:var(--fg)}.mday .list{margin:0}
.ldays{display:flex;flex-direction:column;gap:8px}.rvw>.log:first-child{margin-top:2px}
li.drow.rv,li.drow.pm-q{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:12px 14px}li.drow.rv .t,li.drow.pm-q .t{font-size:15px}li.drow.rv .btns,li.drow.pm-q .btns{margin-top:4px}.rvw-h{margin:6px 0 -4px;font:700 15px var(--f-head);display:flex;gap:6px;align-items:baseline}.rvw-h .num{font:500 13px var(--f-body);color:var(--late)}.lleg .lt{color:var(--faint)}
.log h3{margin:0;font:700 15px var(--f-head)}
.lsum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.lbig{font:700 26px/1.2 var(--f-head);display:flex;align-items:baseline;gap:6px;margin:0}.lbig small{font:500 14px var(--f-body);color:var(--muted)}
.lsplit{display:flex;height:8px;border-radius:9px;overflow:hidden;margin:10px 0 6px;background:var(--sunk)}.lsplit i{display:block}
.lleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:0;padding:0;list-style:none}.lleg li{display:flex;align-items:center;gap:5px}
.lbars{display:flex;align-items:flex-end;justify-content:space-between;height:112px;margin-top:12px;gap:6px}
.lbar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.lbar:disabled{cursor:default}
.lstk{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:7px;overflow:hidden;background:var(--sunk)}.lstk i{display:block}
.lbar small{font-size:12px;color:var(--faint);white-space:nowrap}.lbar .v{font-size:12px;font-weight:700;color:var(--muted);min-height:16px}
.lbar.on small{color:var(--fg);font-weight:700}.lbar.on .lstk{outline:2px solid var(--gold);outline-offset:2px}
.lday{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.lwi{flex:none;width:22px;height:22px;border-radius:7px;background:var(--et);color:var(--ec);display:grid;place-items:center}.lwi .wki{width:13px;height:13px}
.dwi{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--et);color:var(--ec);vertical-align:-4px;margin-inline-end:6px}.dwi .wki{width:12px;height:12px}

.data-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill.soon{background:var(--warn-tint);color:var(--warn)}

/* sections */
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:70px}
button.stat{font:inherit;color:inherit;text-align:start;cursor:pointer;min-height:44px;transition:transform .1s,border-color .15s}
button.stat:active{transform:scale(.97)}button.stat:disabled{cursor:default}
button.stat:not(:disabled):hover{border-color:var(--brand)}

.sunday{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:10px 14px;border-radius:var(--r);background:var(--brand-tint);color:var(--fg);font-size:14.5px;font-weight:600}

.sunday-w{display:flex;gap:6px;align-items:stretch}.sunday-w .sunday{flex:1;min-width:0}
:root{--vac:#0B6FA8;--vac-tint:#DFF0FA;--vac-line:#9CCDEA}

.vac-it{border-top:1px solid var(--line);padding:9px 0 4px}.vac-it .t{font-size:14.5px;font-weight:600}.vac-it small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}.vac-it .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.ci.vac-row{display:block;padding:0;border:1.5px dashed var(--vac-line)!important;border-radius:14px;background:var(--vac-tint);margin:0 0 6px}.vac-line{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 6px}.vac-ic{color:var(--vac)!important;background:transparent!important}.vac-row .ct{flex:1;min-width:0}.vac-row .ct-b{color:var(--vac);font-weight:700}.vac-row .ct small{color:var(--muted)}

.tp-tl b{display:block;font-weight:600}.tp-tl span{font-size:12.5px;color:var(--muted)}.tp-tl li.dn b{text-decoration:line-through;color:var(--muted)}

القواعد:
- title: صياغة قصيرة واضحة بعربية سليمة مصححة إملائيًا، تبدأ بفعل في المهام، وبلا تاريخ أو وقت.
- type = meeting إذا كان «موعدًا» بوقت يحضره: اجتماع، لقاء، موعد، دورة، ورشة، محاضرة، ندوة، ملتقى، مؤتمر، مناسبة، حفل، زيارة. وإلا task.
- الفرق: الموعد شيء تحضره مع غيرك أو في مكان بوقت ومدة. والمهمة شيء تنجزه بنفسك ولو كان له يوم وساعة أو يتكرر. فـ«مراجعة رصيد البطاقة الساعة 8 كل شهر» و«أرسل الإيميل بكرة 10» و«سداد الفاتورة» و«جهّز عرض لاجتماع الأحد» كلها task، والساعة فيها تذكير (remindDate و remindTime) لا time. إذا بدأ بفعل إنجاز (راجع، أرسل، جهّز، اكتب، سدّد، تواصل، اطلب، حدّث، جدّد، اشترِ…) فهو task حتى لو ذُكر فيه اجتماع.
- الحجوزات بيوم ووقت (طيران، رحلة الذهاب أو العودة، فندق أو سكن، تأجير سيارة، حجز مطعم أو مقهى أو تذكرة) = meeting، و title يصف الحجز مثل «طيران الرياض ← مانشستر» أو «فندق Kimpton». رقم الحجز إن ذُكر يوضع في الحقل "ref" وحده لا في title. وإن ذكر تاريخًا مثل «14 نوفمبر» خارج القائمة فاحسبه بالسنة الأقرب القادمة.
- size = big إذا قال إنها كبيرة أو تحتاج جهدًا طويلًا (أكثر من ساعة تقريبًا)، وإلا small.
- days للمهام فقط: الأيام التي ذكر أنه سيشتغل فيها عليها، بتواريخها من القائمة أعلاه، ومصفوفة فارغة إذا لم يذكر يومًا.
- due و dueTime للمهام فقط: الموعد النهائي إذا ذكره صراحة، مثل «قبل الخميس» أو «آخر موعد الأحد» أو «لازم تخلص يوم الإثنين» أو «التسليم الساعة 12». يوم الموعد النهائي لا يُكرَّر في days إلا إذا قال إنه سيشتغل عليها فيه. ضع null إذا لم يذكر موعدًا نهائيًا.
- waitingFor و followUp للمهام فقط: إذا كان الأمر عند شخص آخر وهو ينتظر منه شيئًا (أرسل له، طلب منه، كلّفه، فوّضه، بانتظار رده)، فضع اسم الشخص كما قاله في waitingFor، واجعل title يصف المنتظر مثل «رد خالد على الميزانية». و followUp يوم المتابعة إن ذكره («تابعه الأحد») وإلا null. وإلا فاجعلهما null.
- remindDate و remindTime للمهام فقط: فقط إذا طلب تذكيرًا صريحًا مثل «ذكّرني» أو «نبّهني». remindTime وقت التذكير، و remindDate يومه إن ذكره وإلا null. لا تضع تذكيرًا لم يطلبه.
- للمواعيد (meeting): date و time فقط إن ذُكرا، بنظام 24 ساعة. «الساعة 4» بلا تحديد تعني 16:00 إذا كانت بين 1 و6، و«الصبح» صباحًا. لا تخمّن تاريخًا أو وقتًا لم يُذكر. duration بالدقائق إن ذُكرت المدة. rem للمواعيد فقط إذا قال «ذكّرني قبله بـ…»: مصفوفة دقائق من القيم 0 و5 و15 و30 و60 و1440 (يوم)، وإلا null.
- work = نوع العمل الغالب في المهمة: call اتصال، mail بريد أو رسالة، write كتابة أو إعداد أو تجهيز، review مراجعة أو اعتماد أو توقيع، meet اجتماع أو لقاء، visit زيارة أو مشوار، buy شراء، pay دفع أو سداد. إن لم ينطبق نوع واضح فاجعلها null. للمواعيد اجعلها null.
- canDo = true إذا كان مساعد كتابي يستطيع إنجازها أو تجهيز جزء منها كتابةً: تغريدة، منشور، بريد، خطاب، خطة، تقرير، أجندة اجتماع. واختر canDoKind المناسب. للاجتماعات اجعلها true مع «أجندة اجتماع» فقط إذا ذكر تحضيرًا أو أجندة.
- لا تخترع عناصر لم تُذكر، ولا تدمج عنصرين مختلفين في عنصر واحد.

async function understand(){

    const raw=await S.sample.json(parsePrompt(text),{modelTier:'quick',signal:ctl.signal,cache:false});

    const out=normalize(raw);

function tPts(i){const o=[];if(i.due&&i.dueTime)o.push({d:i.due,t:i.dueTime,k:'t'});if(i.remindDate&&i.remindTime&&!(i.remindDate===i.due&&i.remindTime===i.dueTime))o.push({d:i.remindDate,t:i.remindTime,k:'r'});return o}

const tcat=i=>{if(!i||i.type!=='meeting')return null;const c=i.cat||catGuess((i.title||'')+' '+(i.location||''));return c==='flight'||c==='train'?c:null};
function clashOf(p,exId,ty,fl,soft){
  if(!p)return[];const mn=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};const out=[];
  const H=(i,d,t)=>toTz(d,t,tzOf(i),HOME_TZ);
  const isF=i=>!!tcat(i);const mt=[...S.items.values()].filter(i=>i.type==='meeting'&&i.status!=='done'&&i.id!==exId&&i.time&&+i.duration<1440&&(fl?isF(i):isF(i)===isF(p))).concat((S.pending||[]).filter(q=>q!==p&&q.type==='meeting'&&q.date&&q.time&&+q.duration<1440&&(fl?isF(q):isF(q)===isF(p))));

  connect();
}
let connecting=0;
async function connect(){
  if(connecting||S.col)return;connecting=1;
  try{await connectOnce()}catch(_){}
  connecting=0;
  if(!S.col&&window.claude&&typeof window.claude.use==='function')setTimeout(connect,20000);
}
async function connectOnce(){
  const C=window.claude;
  if(!C||typeof C.use!=='function'){S.ready=true;render();note('افتح الدفتر داخل Claude ليُحفظ في حسابك.');return}
  const [db,user,sample,mcp,dl]=await Promise.all(['db','user','sample','mcp','downloads'].map(n=>withTO(C.use(n),15000).catch(()=>null)));
  try{S.toolsOn=localStorage.getItem('daftar-tools')==='1'}catch(_){}S.sample=sample;S.mcp=mcp;S.dl=dl;
  let uid=null;try{uid=user?await withTO(user.id(),15000):null}catch(_){}
  if(db&&uid){
    if(S.cacheUid&&S.cacheUid!==uid){S.items=new Map();S.vacs=new Map();OB.map=new Map();S.fromCache=0;obSave()}
    S.uid=uid;S.col=db.collection('data/users/'+uid);
    try{S.meta=db.collection('data/users/'+uid+'/meta/kv');S.meta.onSnapshot(sn=>{sn.docs.forEach(d=>{if(d.id==='review'&&d.exists){const v=(d.data()||{}).seen;if(v&&v!==S.revSeen){S.revSeen=v;render()}}if(d.id==='hint'&&d.exists&&(d.data()||{}).off&&!S.hintOff){S.hintOff=true;render()}if(d.id==='tools'&&d.exists){const on=!!(d.data()||{}).on;if(on!==!!S.toolsOn){S.toolsOn=on;render()}}if(d.id==='calq'&&d.exists){const q=(d.data()||{}).ids||[];if(!S.calqLoaded){S.calqLoaded=1;S.calq=[...new Set([...(S.calq||[]),...q])];setTimeout(calRetry,1500)}}})},()=>{})}catch(_){S.meta=null}
    S.col.onSnapshot(snap=>{
      const m=new Map(),vm=new Map();snap.docs.forEach(d=>{if(d.exists){const o=JSON.parse(JSON.stringify(d.data()));o.id=d.id;(o.type==='vacation'?vm:m).set(d.id,o)}});
      obOverlay(m,vm);S.vacs=vm;S.items=m;S.ready=true;S.fromCache=0;S.net='ok';if(!S.repFixed){S.repFixed=1;try{repRepair()}catch(_){}}render();cacheSave();netUI();obFlush();if(!S.updRetried){S.updRetried=1;setTimeout(()=>{calLost();calRetry()},1500)}
    },err=>{S.ready=true;render();if(err&&err.code==='revoked')note('انقطع الوصول إلى بياناتك. أعد فتح الصفحة.');else if(S.items.size){S.net='off';netUI()}else note('تعذّر تحميل بياناتك. أعد فتح الصفحة.')});
    obFlush();
  }else{S.ready=true;render();if(S.items.size||OB.map.size){S.net='off';netUI()}else if(navigator.onLine===false){S.net='off';netUI()}else if(!S.loginNoted){S.loginNoted=1;note('سجّل الدخول إلى Claude ليُحفظ دفترك في حسابك.')}}
}
boot();
})();
</script>
